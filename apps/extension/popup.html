<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compendium Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Compendium Capture</h1>
      <p class="tagline">Track your curiosity</p>
    </header>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="tab tab-passive active" data-tab="passive">
        <span class="tab-dot dot-passive"></span>
        Passive
      </button>
      <button class="tab tab-active" data-tab="active">
        Active
      </button>
    </div>

    <main>
      <!-- Passive Tab Panel -->
      <div id="panelPassive" class="tab-panel">
        <div id="passiveStatus" class="status status-active">
          Always tracking
        </div>

        <div class="session-info">
          <div class="stat">
            <span class="stat-label">Current capture</span>
            <span id="passivePageCount" class="stat-value">0</span>
            <span class="stat-label">pages</span>
          </div>
          <div class="stat">
            <span class="stat-label">Completed</span>
            <span id="completedCount" class="stat-value">0</span>
            <span class="stat-label">captures</span>
          </div>
        </div>

        <div id="captureId" class="session-id">No active capture</div>

        <button id="forceExportBtn" class="btn btn-export">
          Force Export
        </button>

        <div id="exportStatus" class="export-status hidden"></div>

        <div id="pendingNotice" class="pending-notice hidden">
          <span id="pendingCount">0</span> captures awaiting delivery
        </div>

        <a id="viewCacheLink" class="cache-link" href="#">View capture cache</a>

        <div class="set-default-row">
          <button id="setDefaultPassive" class="btn-set-default">Set as default view</button>
        </div>
      </div>

      <!-- Active Tab Panel -->
      <div id="panelActive" class="tab-panel hidden">
        <div id="journeyReady">
          <p class="active-status-text">Ready to record</p>
          <button id="startBtn" class="btn btn-active-start">Start Capture</button>
        </div>

        <div id="journeyActive" class="hidden">
          <div class="tracking-status">
            <span class="status-dot dot-active"></span>
            <span class="status-text">Recording...</span>
          </div>
          <div class="active-stats">
            <div class="stat">
              <span id="activePageCount" class="stat-value stat-value-active">0</span>
              <span class="stat-label">pages</span>
            </div>
            <div class="stat">
              <span id="duration" class="stat-value stat-value-active">0:00</span>
              <span class="stat-label">time</span>
            </div>
          </div>
          <button id="stopBtn" class="btn btn-active-stop">Stop Capture</button>
        </div>

        <div class="set-default-row">
          <button id="setDefaultActive" class="btn-set-default">Set as default view</button>
        </div>
      </div>
    </main>
    <!-- Settings (collapsible) -->
    <details class="settings-panel">
      <summary class="settings-toggle">Settings</summary>
      <div class="settings-body">
        <label class="settings-label">
          Backend URL
          <input id="settingsBackendUrl" type="text" class="settings-input"
                 placeholder="http://localhost:8001">
        </label>
        <label class="settings-label">
          API Key
          <input id="settingsApiKey" type="password" class="settings-input"
                 placeholder="cmp_...">
        </label>
        <label class="settings-label">
          Device label
          <input id="settingsDeviceLabel" type="text" class="settings-input"
                 placeholder="e.g. new-laptop">
        </label>
        <button id="saveSettingsBtn" class="btn btn-settings-save">Save</button>
        <span id="settingsSaved" class="settings-saved hidden">Saved</span>
      </div>
    </details>
  </div>

  <script src="popup.js"></script>
</body>
</html>
