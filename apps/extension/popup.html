<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compendium Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Compendium Capture</h1>
      <a id="version" class="version"></a>
    </header>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <button class="tab tab-passive active" data-tab="passive" title="Passive capture of your browsing, finalized after 60 minutes idle (switch below turns it off)">
        <span class="tab-dot dot-passive"></span>
        Passive
      </button>
      <button class="tab tab-active" data-tab="active" title="A journey you start and stop yourself">
        Active
      </button>
    </div>

    <main>
      <!-- Passive Tab Panel -->
      <div id="panelPassive" class="tab-panel">
        <div id="passiveStatus" class="status status-active">
          Always tracking
        </div>

        <label class="switch-row" title="Turn passive tracking off if you only want to record journeys you start yourself">
          <span>Passive tracking</span>
          <input type="checkbox" id="passiveToggle" class="switch">
          <span class="switch-track"></span>
        </label>

        <div class="session-info">
          <div class="stat" title="Pages recorded in the capture still open">
            <span id="passivePageCount" class="stat-value">0</span>
            <span class="stat-label">pages in this capture</span>
          </div>
          <div class="stat" title="Captures finalized on this device">
            <span id="completedCount" class="stat-value">0</span>
            <span class="stat-label">captures completed</span>
          </div>
        </div>

        <div class="session-id" title="Id of the capture still open; appears in the cache page"><span id="captureIdPrefix">Current capture: </span><span class="mono" id="captureId">No active capture</span></div>

        <button id="forceExportBtn" class="btn btn-export" title="Finalize the open capture now and send everything buffered">
          Force export
        </button>

        <div id="exportStatus" class="export-status hidden"></div>

        <div id="pendingNotice" class="pending-notice hidden" title="Captures saved on this device that the server has not confirmed yet">
          <span id="pendingCount">0</span> captures awaiting delivery
        </div>

        <div class="links">
          <a id="viewCacheLink" class="cache-link" href="#" title="Open the cache page: every capture kept on this device, with retry and download">View capture cache</a>
        </div>
      </div>

      <!-- Active Tab Panel -->
      <div id="panelActive" class="tab-panel hidden">
        <div id="journeyReady">
          <p class="active-status-text">Ready to record</p>
          <button id="startBtn" class="btn btn-active-start" title="Begin recording a journey you can stop anytime">Start capture</button>
        </div>

        <div id="journeyActive" class="hidden">
          <div class="tracking-status">
            <span class="status-dot dot-active"></span>
            <span class="status-text">Recording a journey</span>
          </div>
          <div class="active-stats">
            <div class="stat">
              <span id="activePageCount" class="stat-value stat-value-active">0</span>
              <span class="stat-label">pages</span>
            </div>
            <div class="stat">
              <span id="duration" class="stat-value stat-value-active">0:00</span>
              <span class="stat-label">elapsed</span>
            </div>
          </div>
          <button id="stopBtn" class="btn btn-active-stop" title="Finish this journey and save it">Stop capture</button>
          <div class="active-note">Passive tracking pauses while a journey records.</div>
        </div>
      </div>
    </main>
    <!-- Settings (collapsible) -->
    <details class="settings-panel" open>
      <summary class="settings-toggle">Settings</summary>
      <div class="settings-body">
        <label class="settings-label" title="Where captures are sent">
          Backend URL
          <input id="settingsBackendUrl" type="text" class="settings-input"
                 placeholder="http://localhost:8001">
        </label>
        <label class="settings-label" for="settingsApiKey" title="Identifies this browser to the backend">
          API key
          <input id="settingsApiKey" type="text" class="settings-input mono"
                 placeholder="cmp_…" autocomplete="off" spellcheck="false">
        </label>
        <div id="settingsError" class="settings-error hidden" role="alert"></div>
        <label class="settings-label" title="Name stored with each capture so you can tell devices apart">
          Device label
          <input id="settingsDeviceLabel" type="text" class="settings-input"
                 placeholder="e.g. Work laptop">
        </label>
        <button id="saveSettingsBtn" class="btn btn-settings-save">Save</button>
        <span id="settingsSaved" class="settings-saved hidden">Saved</span>
      </div>
    </details>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
