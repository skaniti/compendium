<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compendium Capture / Cache</title>
  <link rel="stylesheet" href="cache.css">
</head>
<body>
  <div class="cache-container">
    <header class="cache-header">
      <h1>Compendium Capture / Cache</h1>
      <p class="subtitle">Emergency recovery &amp; capture inspection</p>
    </header>

    <div class="toolbar">
      <span id="summary" class="summary">Loading...</span>
      <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
      <button id="downloadAllBtn" class="btn btn-primary" disabled>Download All as ZIP</button>
    </div>

    <section id="activeSection" class="section">
      <h2 class="section-title">Active Capture</h2>
      <div id="activeContainer" class="empty-state">No active capture</div>
    </section>

    <section id="historySection" class="section">
      <h2 class="section-title">History</h2>
      <p class="section-hint">All finalized passive captures. Items awaiting retry are badged FAILED; the rest are confirmed delivered to the server.</p>
      <div id="historyContainer" class="empty-state">No captures in history</div>
    </section>

  </div>

  <script src="cache.js"></script>
</body>
</html>
