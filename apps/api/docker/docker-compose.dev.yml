# Local dev mirror database (desktop-era, 2026-07-02).
#
# Runs the disposable replica of compendium-server's Postgres that the dev
# app + refresh scripts expect on localhost:5433. The pgvector image matches
# the server (docker/server/docker-compose.yml uses the same one), so dumps
# restore without extension gymnastics.
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#
# Data lives in a named volume; the DB is still disposable by contract
# (scripts/dev/refresh_local_db.sh --restore drops and rebuilds it from the
# newest synced server dump). Container name matches what project docs have
# always called the local mirror.
#
# History: the local mirror ran as native Windows PostgreSQL 16 on the Yoga
# laptop until the 2026-07-02 dev flip moved canonical dev to the desktop
# (docs/project-plans/2026-07-02-234659-compendium-dev-stack-desktop-port/).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compendium-explorer-postgres-1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: tbd
      POSTGRES_PASSWORD: tbd_local
      POSTGRES_DB: traversal_discovery
    volumes:
      - compendium_pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbd -d traversal_discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  compendium_pg16_data:
