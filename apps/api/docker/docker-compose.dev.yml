# Disposable local dev database for apps/api.
#
# Postgres + pgvector on localhost:5433, matching the major version the
# app targets. The DB is throwaway by contract: drop the volume and the
# migration chain (backend/db/migrate.py) rebuilds the schema from scratch.
#
#   docker compose -f docker/docker-compose.dev.yml up -d
#
# Credentials are the documented generic local-dev values (matching
# .env.example and docker/init-test-db.sh) — never used outside localhost.
# If port 5433 is taken on your machine, override with a compose override
# file rather than editing this one.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: tbd
      POSTGRES_PASSWORD: tbd_local
      POSTGRES_DB: traversal_discovery
    volumes:
      - compendium_api_pg16_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbd -d traversal_discovery"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  compendium_api_pg16_data:
