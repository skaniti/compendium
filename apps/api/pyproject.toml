# Ruff config -- introduced alongside the new pre-commit suite.
# Goal: keep ruff-format mandatory across the repo, but accept the legacy
# patterns the existing codebase relies on so lint passes today. Tighten
# rule-by-rule as code is touched (each rule below has a "why ignored" note
# so a future cleanup pass knows what to revisit first).
#
# Trimmed at the apps/api extraction (batch 07): dropped `docs/` (no docs/
# dir under apps/api) and `.specstory/` (session transcripts live at the
# monorepo root, not here). Kept `*.ipynb` (harmless if one ever appears),
# `data/` (apps/api/data/synthetic exists), and `.archive/` (regenerated at
# apps/api/.archive/icon-manifests/ by scripts/build_icon_manifests.py).

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "*.ipynb",            # notebook cells have their own conventions
    "data/",              # synthetic test fixtures, not lint-relevant
    ".archive/",          # icon-manifest archive, regenerated by build_icon_manifests.py
]

[tool.ruff.lint]
# Ruff's default rule set is `E` + `F`. We keep both enabled but suppress
# the categories that are intentional in this codebase:
ignore = [
    # E402 -- 110 hits (at the pre-extraction count). Most scripts perform
    # `sys.path.insert(0, project_root)` before their package imports so
    # they can be invoked directly (`python scripts/foo.py`). The
    # alternative is shipping a package, which isn't in scope.
    "E402",
    # E741 -- 44 hits. Single-letter names (`l`, `I`) appear in tight
    # comprehensions and test fixtures where a longer name would hurt
    # readability more than the rule helps.
    "E741",
    # F841 -- 3 hits in agent.py / refetch_github.py where a captured
    # `latency_ms` / `skipped` is reserved for an in-progress observability
    # hook. Suppress globally for now; remove this ignore when those
    # scaffolds are wired up so the warning surfaces if they regress.
    "F841",
    # F401 -- 1 hit in notebooks/03_02_model_connectivity.ipynb where
    # `transformers.pipeline` is imported purely as an availability probe.
    # Notebooks are already excluded above; this is a belt-and-braces line
    # in case ruff's notebook handling changes.
    "F401",
]
