# Compendium on your own data, behind a real sign-in (README.md,
# "Full-stack (Docker)").
#
#   cp .env.example .env     # fill in the required values first
#   docker compose up --build
#
# Brings up postgres+pgvector -> apps/api (migrations on boot, then creates
# or updates your login from BOOTSTRAP_EMAIL/BOOTSTRAP_PASSWORD, then
# uvicorn) -> apps/web (Next.js, proxying /api/* to apps/api). The compendium
# starts empty; the Firefox extension and the Android collector fill it. To
# look around a populated app instead, use `npm run demo` (no Docker).
#
# Every required value comes from a sibling `.env` (docker compose reads it
# automatically; see `.env.example`). A missing or empty one stops compose
# with an error naming it. Nothing secret lives in this file. The Postgres
# credentials below are internal to the compose network (db is never
# published), not a login.
#
# Access: the web UI binds to 127.0.0.1 because its sign-in cookies are
# Secure-only, which browsers accept over plain http on localhost only. The
# API binds to API_BIND_ADDRESS (default 0.0.0.0) so the Android collector
# can reach it on your network; set 127.0.0.1 to keep it on this machine.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tbd
      POSTGRES_PASSWORD: tbd_local
      POSTGRES_DB: traversal_discovery
    volumes:
      - compendium_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbd -d traversal_discovery"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Real deployment mode: no dev auth bypass, no /docs, and the API
      # refuses to start on a default JWT secret, a CORS wildcard or the
      # default session-ingress value (backend/config/settings.py).
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://tbd:tbd_local@db:5432/traversal_discovery
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (see .env.example)}"
      SESSION_INGRESS_TRUSTED_VALUE: "${SESSION_INGRESS_TRUSTED_VALUE:?set SESSION_INGRESS_TRUSTED_VALUE in .env (see .env.example)}"
      RUN_MIGRATIONS: "1"
      # Create (or re-sync) your login from .env on every boot; no demo user.
      BOOTSTRAP_USERS: "1"
      BOOTSTRAP_PRIMARY_ONLY: "1"
      BOOTSTRAP_EMAIL: "${BOOTSTRAP_EMAIL:?set BOOTSTRAP_EMAIL in .env (see .env.example)}"
      BOOTSTRAP_PASSWORD: "${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD in .env (see .env.example)}"
      BOOTSTRAP_NAME: "${BOOTSTRAP_NAME:-user}"
      # Auto-recluster and the pending sweep cluster the default user, so it
      # has to be you (get_default_user_id in backend/api/main.py).
      DEV_DEFAULT_USER_EMAIL: "${BOOTSTRAP_EMAIL:?set BOOTSTRAP_EMAIL in .env (see .env.example)}"
      DISABLE_REGISTRATION: "1"
      # Required: the capture pipeline's skip and learning gates, cluster
      # naming and chat all call OpenAI. Without it no graph ever forms.
      OPENAI_API_KEY: "${OPENAI_API_KEY:?set OPENAI_API_KEY in .env (see .env.example)}"
      # Optional; unused by this stack today.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      # Archived page-preview images and stylesheets for your captures.
      - compendium_assets:/app/data/captures/assets
      # Lazily downloaded embedding/reranker weights, kept across `down`/`up`.
      - compendium_hf_cache:/root/.cache/huggingface
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the /captured-assets/* rewrite at `next build` time —
        # must match the runtime BACKEND_URL below (see apps/web/Dockerfile).
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      BACKEND_URL: http://api:8000
      # Redirect signed-out visitors to /login (apps/web/proxy.ts).
      AUTH_REQUIRED: "1"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  compendium_pg_data:
  compendium_hf_cache:
  compendium_assets:
